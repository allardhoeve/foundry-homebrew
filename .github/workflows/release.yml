name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # --allow-same-version because the tag and package.json are expected to agree:
      # module.json's version is what Foundry reads from main to offer an update, so it
      # is bumped before tagging, and package.json is kept in step with it. Without the
      # flag npm exits 1 with "Version not changed" and the release never builds.
      - name: Stamp version from git tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          npm version "$TAG" --no-git-tag-version --allow-same-version
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$TAG\"/" module/module.json

      - name: Build compendium pack
        run: npm run build

      - name: Create release zip
        run: |
          cd module
          zip -r ../module.zip \
            module.json \
            packs/ \
            macros/ \
            src/ \
            styles/ \
            assets/ \
            lang/ \
            templates/
          cd ..
          zip module.zip LICENSE

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: module.zip
          generate_release_notes: true
