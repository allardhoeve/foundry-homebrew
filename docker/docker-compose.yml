secrets:
  foundry_config_json:
    file: secrets.json

services:
  foundry:
    container_name: foundry
    hostname: foundry
    image: felddy/foundryvtt:release
    secrets:
      - source: foundry_config_json
        target: config.json
    ports:
      - 30000:30000
    volumes:
      - ./data:/data/
      - ../module:/data/Data/modules/foundry-homebrew:ro
      - /Users/allard/devel/foundryvtt-shadowdark/system:/data/Data/systems/shadowdark
